[project]
name = "rbn-cancer-classifier"
version = "1.0.0"
description = "Random Boolean network attractor features for classifying ovarian cancer from serum mass spectra, compared with a random forest."
readme = "README.md"
authors = [{ name = "Findlay Brown" }]
requires-python = ">=3.12"
# Lower bounds as submitted; uv.lock pins the versions the tests and CI use.
dependencies = [
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The code imports its stages as top-level packages, as `python src` runs it.
pythonpath = ["src", "scripts"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-randomly>=5.1.0",
    "ruff>=0.17.6",
]

[tool.ruff.lint.per-file-ignores]
